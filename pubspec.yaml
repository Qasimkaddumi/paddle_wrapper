version: 0.1.1
homepage: https://github.com/Qasimkaddumi/paddle_wrapper
repository: https://github.com/Qasimkaddumi/paddle_wrapper
issue_tracker: https://github.com/Qasimkaddumi/paddle_wrapper/issues
